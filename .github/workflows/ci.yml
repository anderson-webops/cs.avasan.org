name: CI

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    backend-install:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm
                  cache-dependency-path: back-end/package-lock.json

            - name: Pin npm version
              run: |
                  npm -v
                  npm i -g npm@11.16.0
                  npm -v

            - name: Install backend deps with backend lockfile
              working-directory: back-end
              run: npm ci --include=optional --strict-allow-scripts --workspaces=false

            - name: Verify standalone backend dependency tree
              working-directory: back-end
              run: npm ls --all --workspaces=false

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            # Make runner's npm match packageManager in package.json
            - name: Pin npm version
              run: |
                  npm -v
                  npm i -g npm@11.16.0
                  npm -v

            - name: Install deps
              env:
                  CYPRESS_INSTALL_BINARY: "0"
                  PUPPETEER_SKIP_DOWNLOAD: "true"
              run: npm ci --include=optional --strict-allow-scripts

            # Root "lint" runs front-end and back-end lint
            - name: Lint
              run: npm run lint

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@11.16.0
                  npm -v

            - name: Install deps
              env:
                  CYPRESS_INSTALL_BINARY: "0"
                  PUPPETEER_SKIP_DOWNLOAD: "true"
              run: npm ci --include=optional --strict-allow-scripts

            - name: Typecheck
              run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [24.18.0]
                os: [ubuntu-latest]
            fail-fast: false

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix['node-version'] }}
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            # Only pin npm if compatible
            - name: Pin npm version (if supported)
              run: |
                  # optional guard:
                  if [ $(node -v | cut -d. -f1 | sed 's/v//') -ge 20 ]; then
                    npm i -g npm@11.16.0
                  fi
                  npm -v

            - name: Install deps
              env:
                  CYPRESS_INSTALL_BINARY: "0"
                  PUPPETEER_SKIP_DOWNLOAD: "true"
              run: npm ci --include=optional --strict-allow-scripts

            - name: Unit tests
              env:
                  VITEST_WATCH: "false"
              run: |
                  ulimit -n 4096 || true
                  npm run -w front-end test:unit

            - name: Backend tests
              env:
                  VITEST_WATCH: "false"
              run: npm run -w back-end test

    accessibility:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@11.16.0
                  npm -v

            - name: Install deps
              env:
                  CYPRESS_INSTALL_BINARY: "0"
              run: npm ci --include=optional --strict-allow-scripts

            - name: Axe accessibility smoke checks
              run: npm run a11y

    static-media:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@11.16.0
                  npm -v

            - name: Install deps
              env:
                  CYPRESS_INSTALL_BINARY: "0"
                  PUPPETEER_SKIP_DOWNLOAD: "true"
              run: npm ci --include=optional --strict-allow-scripts

            - name: Audit static course media
              run: npm run audit:static-media

    test-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Pin npm version
              run: |
                  npm i -g npm@11.16.0
                  npm -v

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install deps
              env:
                  PUPPETEER_SKIP_DOWNLOAD: "true"
              run: npm ci --include=optional --strict-allow-scripts

            - name: Build front-end
              run: npm run -w front-end build

            - name: Cypress
              uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
              with:
                  install: false
                  working-directory: front-end
                  config-file: cypress.config.ts
                  start: npm run preview -- --port 3333
                  wait-on: "http://localhost:3333"

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@11.16.0
                  npm -v

            - name: Install deps
              env:
                  CYPRESS_INSTALL_BINARY: "0"
                  PUPPETEER_SKIP_DOWNLOAD: "true"
              run: npm ci --include=optional --strict-allow-scripts

            - name: Verify CI supply-chain configuration
              run: npm run test:ci-security

            - name: Audit all dependencies
              run: npm run audit:full

            - name: Audit production dependencies
              run: npm run audit:production

            - name: Verify registry signatures
              run: npm run audit:signatures

            - name: Verify dependency trees
              run: npm run verify:dependency-tree

            - name: Build
              run: npm run build

    container-stack:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CS_AVASAN_LISTEN_PORT: "18080"
            INTERNAL_DIAGNOSTICS_KEY: ci-only-internal-diagnostics-key
            MONGO_APP_PASSWORD: ci-only-application-password
            MONGO_APP_USERNAME: ci_app
            MONGO_ROOT_PASSWORD: ci-only-url-safe-password
            MONGO_ROOT_USERNAME: ci
            SESSION_SECRET: ci-only-session-secret-at-least-thirty-two-bytes
            SOURCE_REVISION: ${{ github.sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0

            - name: Derive release version from package metadata
              shell: bash
              run: |
                  node --input-type=module <<'NODE'
                  import { appendFileSync, readFileSync } from "node:fs"

                  const { version } = JSON.parse(readFileSync("package.json", "utf8"))
                  const semver = /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/
                  if (typeof version !== "string" || !semver.test(version)) {
                    throw new Error("package.json version must be a valid semantic version")
                  }
                  appendFileSync(process.env.GITHUB_ENV, `CS_RELEASE_VERSION=${version}\n`)
                  NODE

            - name: Prepare fail-closed environment
              run: |
                  cp deploy/cs.env.example deploy/cs.env
                  chmod 600 deploy/cs.env
                  ./scripts/verify-deploy-env-permissions.sh

            - name: Reject missing production revision
              run: |
                  if env -u SOURCE_REVISION docker compose --env-file deploy/cs.env --profile tools -f compose.production.yml config --quiet; then
                    echo "Production Compose accepted a missing SOURCE_REVISION." >&2
                    exit 1
                  fi

            - name: Validate production Compose
              run: docker compose --env-file deploy/cs.env --profile tools -f compose.production.yml config --quiet

            - name: Build production images
              run: docker compose --env-file deploy/cs.env --profile tools -f compose.production.yml build

            - name: Start fail-closed production stack
              run: docker compose --env-file deploy/cs.env --profile tools -f compose.production.yml up --detach --wait --no-build web

            - name: Smoke production proxy and rollout gates
              run: |
                  origin=http://127.0.0.1:${CS_AVASAN_LISTEN_PORT}
                  curl --fail --silent --show-error "${origin}/" >/dev/null
                  curl --fail --silent --show-error "${origin}/ide" >/dev/null
                  curl --fail --silent --show-error "${origin}/python-ide/assets/manifest.json" >/dev/null
                  curl --fail --silent --show-error "${origin}/api/healthz" >/dev/null
                  curl --fail --silent --show-error "${origin}/api/readyz" >/dev/null

                  for retired_graph_path in \
                    /graph-sketcher \
                    /graph-sketcher/ \
                    /graph-sketcher/index.html \
                    /graph-sketcher.html \
                    /assets/GraphSketcherWorkspace-retired.js \
                    /assets/graphSketcherArchive.worker-retired.js \
                    /assets/graph-sketcher-retired.js \
                    /licenses/graphsketcher-omni-source-license.txt; do
                    retired_graph_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                      "${origin}${retired_graph_path}")
                    test "${retired_graph_status}" = "404"
                  done

                  unknown_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                    "${origin}/__cs-avasan-deployment-probe-missing")
                  test "${unknown_status}" = "404"

                  student_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "${origin}/api/students/session")
                  test "${student_status}" = "404"

                  analytics_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                    --request POST \
                    --header 'Content-Type: application/json' \
                    --header 'X-Classroom-Request: 1' \
                    --header 'Origin: https://cs.avasan.org' \
                    --data '{"siteID":"cs","event":"ide-open"}' \
                    "${origin}/api/classroom-usage")
                  test "${analytics_status}" = "404"

                  admin_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "${origin}/api/admins/loggedin")
                  test "${admin_status}" = "403"

                  CS_EXPECTED_RELEASE="${CS_RELEASE_VERSION}" \
                  CS_EXPECTED_REVISION="${SOURCE_REVISION}" \
                  CS_EXPECT_CLASSROOM_ANALYTICS_COLLECTION_ENABLED=false \
                  CS_EXPECT_STUDENT_ACCOUNTS_ENABLED=false \
                  CS_EXPECT_STUDENT_OAUTH_ENABLED=false \
                  CS_SITE_ORIGIN="${origin}" \
                    npm run verify:production

            - name: Reject backend exceptions and deprecation warnings
              run: |
                  docker compose --env-file deploy/cs.env --profile tools -f compose.production.yml logs --no-color api > /tmp/cs-avasan-api.log
                  if grep -Eiq 'deprecationwarning|unhandledrejection|uncaughtexception|(^|[^a-z])exception([^a-z]|$)|(^|[^a-z])error:' /tmp/cs-avasan-api.log; then
                    sed -n '1,240p' /tmp/cs-avasan-api.log
                    exit 1
                  fi

            - name: Show container diagnostics after failure
              if: failure()
              run: docker compose --env-file deploy/cs.env --profile tools -f compose.production.yml logs --no-color

            - name: Remove production test stack
              if: always()
              run: docker compose --env-file deploy/cs.env --profile tools -f compose.production.yml down --volumes --remove-orphans
