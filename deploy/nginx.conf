map $http_x_forwarded_proto $classroom_forwarded_proto {
	default $scheme;
	http http;
	https https;
}

map $uri $classroom_cache_control {
	default "";
	/release.json "no-store";
}

server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;
	absolute_redirect off;

	access_log off;
	client_max_body_size 80m;
	server_tokens off;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
	add_header X-Frame-Options "DENY" always;
	add_header Cache-Control $classroom_cache_control always;

	location = /api {
		return 404;
	}

	# Preserve the browser's same-origin cookie boundary and strip the public
	# /api prefix exactly once before sending the request to Express.
	location /api/ {
		proxy_pass http://api:3008/;
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;
		proxy_set_header Connection "";
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_set_header X-Forwarded-Proto $classroom_forwarded_proto;
		proxy_hide_header X-Powered-By;
	}

	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
		add_header X-Frame-Options "DENY" always;
		try_files $uri =404;
	}

	location = /release.json {
		default_type application/json;
		try_files $uri =404;
	}

	# Only the browser-local Python runtime needs WebAssembly evaluation and
	# package downloads. Its opaque srcdoc frame applies a second, narrower CSP.
	location ^~ /python-ide/ {
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdn.plot.ly; connect-src 'self' https://cdn.jsdelivr.net https://pypi.org https://files.pythonhosted.org; frame-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
		add_header X-Frame-Options "DENY" always;
		try_files $uri $uri/ =404;
	}

	location ~* \.(?:css|gif|ico|jpe?g|js|mjs|png|svg|webp|woff2?)$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
		add_header X-Frame-Options "DENY" always;
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
