[build]
publish = "front-end/dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "24.18.0"
VITE_CLASSROOM_PRIVACY_APPROVED = "false"
VITE_CLASSROOM_PRIVACY_OPERATOR_NOTICE = ""
VITE_CLASSROOM_PRIVACY_POLICY_EFFECTIVE_DATE = ""
VITE_CLASSROOM_PRIVACY_POLICY_VERSION = ""
VITE_CLASSROOM_SERVICE_PROVIDER_NOTICE = ""
VITE_CLASSROOM_USAGE_ENABLED = "false"
VITE_CLASSROOM_ANALYTICS_RETENTION_DAYS = ""
VITE_SCHOOL_PRIVACY_CONTACT = ""
VITE_STUDENT_ACCOUNTS_ENABLED = "false"
VITE_STUDENT_OAUTH_ENABLED = "false"
VITE_STUDENT_RECORD_RETENTION_DAYS = ""

[[redirects]]
from = "/api/*"
to = "/api-unavailable"
status = 404
force = true

[[redirects]]
from = "/ide"
to = "/ide/"
status = 301
force = true

[[redirects]]
from = "/ide.html"
to = "/ide/"
status = 301
force = true

[[redirects]]
from = "/python-ide"
to = "/ide/"
status = 301
force = true

[[redirects]]
from = "/python-ide.html"
to = "/ide/"
status = 301
force = true

[[redirects]]
from = "/python-ide/"
to = "/ide/"
status = 301
force = true

[[redirects]]
from = "/bluej"
to = "/ide/?mode=bluej"
status = 301
force = true

[[redirects]]
from = "/bluej.html"
to = "/ide/?mode=bluej"
status = 301
force = true

[[redirects]]
from = "/bluej/"
to = "/ide/?mode=bluej"
status = 301
force = true

[[redirects]]
from = "/graph-sketcher"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/graph-sketcher/"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/graph-sketcher/*"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/graph-sketcher.html"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[[headers]]
for = "/*"

[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
Permissions-Policy = "camera=(), geolocation=(), microphone=()"
X-Frame-Options = "DENY"

[[headers]]
for = "/ide/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdn.plot.ly; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://cdn.jsdelivr.net https://pypi.org https://files.pythonhosted.org; frame-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'"

[[headers]]
for = "/python-ide/assets/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdn.plot.ly; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://cdn.jsdelivr.net https://pypi.org https://files.pythonhosted.org; frame-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'"

[[headers]]
for = "/site.webmanifest"

[headers.values]
Content-Type = "application/manifest+json"

[[headers]]
for = "/release.json"

[headers.values]
Cache-Control = "no-store"
Content-Type = "application/json; charset=utf-8"
