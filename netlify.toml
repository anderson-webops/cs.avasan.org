[build]
publish = "front-end/dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "24.18.0"
VITE_CLASSROOM_PRIVACY_APPROVED = "false"
VITE_CLASSROOM_PRIVACY_OPERATOR_NOTICE = ""
VITE_CLASSROOM_SERVICE_PROVIDER_NOTICE = ""
VITE_CLASSROOM_USAGE_ENABLED = "false"
VITE_SCHOOL_PRIVACY_CONTACT = ""
VITE_STUDENT_ACCOUNTS_ENABLED = "false"
VITE_STUDENT_OAUTH_ENABLED = "false"
VITE_STUDENT_RECORD_RETENTION_DAYS = ""

[[redirects]]
from = "/api/*"
to = "/api-unavailable"
status = 404
force = true

[[headers]]
for = "/*"

[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
Permissions-Policy = "camera=(), geolocation=(), microphone=()"
X-Frame-Options = "DENY"

[[headers]]
for = "/site.webmanifest"

[headers.values]
Content-Type = "application/manifest+json"

[[headers]]
for = "/release.json"

[headers.values]
Cache-Control = "no-store"
Content-Type = "application/json; charset=utf-8"
